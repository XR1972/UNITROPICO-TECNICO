<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SGOC XR - 20 DE JULIO</title>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");

const engine = new BABYLON.Engine(canvas, true);

const createScene = async function () {

    const scene = new BABYLON.Scene(engine);

    // Cámara inicial
    const camera = new BABYLON.UniversalCamera(
        "camera",
        new BABYLON.Vector3(0, 1.70, -5),
        scene
    );

    camera.attachControl(canvas, true);

    // Luz
    const light = new BABYLON.HemisphericLight(
        "light",
        new BABYLON.Vector3(0, 1, 0),
        scene
    );

    light.intensity = 1.2;

    // Cargar edificio
    const result = await BABYLON.SceneLoader.ImportMeshAsync(
        "",
        "./",
        "20 DE JULIO 5 PISOS.glb",
        scene
    );

    console.log("MODELO SGOC CARGADO", result);

    // Activar WebXR
    try {

        const xr = await scene.createDefaultXRExperienceAsync({
            floorMeshes: []
        });

        console.log("SGOC XR ACTIVO");

    } catch (error) {

        console.log("WebXR no disponible en este dispositivo", error);

    }

    return scene;
};

createScene().then(scene => {

    engine.runRenderLoop(function () {
        scene.render();
    });

});

window.addEventListener("resize", function () {
    engine.resize();
});
</script>

</body>
</html>
