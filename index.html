<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNITROPICO - Modo OBRA</title>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs@5.54.0/babylon.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@5.54.0/babylonjs.loaders.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; overflow: hidden; background: #000; }
        #renderCanvas { width: 100%; height: 100vh; display: block; }
        #layerPanel { position: fixed; right: 20px; top: 20px; width: 280px; max-height: 85vh; background: rgba(30, 30, 30, 0.95); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; overflow-y: auto; z-index: 100; }
        .panel-title { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-weight: 600; color: #fff; background: rgba(0, 0, 0, 0.3); }
        .floor-header { display: flex; align-items: center; padding: 12px 15px; cursor: pointer; background: rgba(255, 255, 255, 0.03); }
        .floor-header:hover { background: rgba(255, 255, 255, 0.08); }
        .floor-toggle { width: 16px; margin-right: 10px; transition: transform 0.2s; }
        .floor-toggle.collapsed { transform: rotate(-90deg); }
        .floor-name { flex-grow: 1; font-weight: 600; color: #fff; }
        .floor-items { overflow: hidden; transition: max-height 0.3s; }
        .floor-items.collapsed { max-height: 0; }
        .element-item { display: flex; padding: 10px 15px 10px 35px; cursor: pointer; border-left: 3px solid transparent; }
        .element-item:hover { background: rgba(255, 255, 255, 0.05); border-left-color: rgba(100, 150, 255, 0.5); }
        .element-checkbox { width: 16px; height: 16px; margin-right: 10px; border: 1px solid rgba(100, 150, 255, 0.6); background: rgba(100, 150, 255, 0.1); }
        .element-checkbox.checked { background: rgba(100, 150, 255, 0.8); }
        .element-name { font-size: 12px; color: rgba(255, 255, 255, 0.8); flex-grow: 1; }
        #infoHud { position: fixed; bottom: 20px; left: 20px; background: rgba(30, 30, 30, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); padding: 15px; border-radius: 6px; font-size: 12px; color: rgba(255, 255, 255, 0.8); z-index: 99; }
        #controlHints { position: fixed; top: 20px; left: 20px; background: rgba(30, 30, 30, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px; border-radius: 6px; font-size: 11px; z-index: 99; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="controlHints"><strong style="color: #6496ff;">CONTROLES</strong><div>WASD: Movimiento</div><div>Ratón: Mirar</div><div>Espacio: Saltar</div></div>
    <div id="infoHud"><div><span style="color: #6496ff; font-weight: 600;">Piso:</span> <span id="pisoDisplay">CARGANDO</span></div><div><span style="color: #6496ff; font-weight: 600;">Posición:</span> <span id="posDisplay">-</span></div><div><span style="color: #6496ff; font-weight: 600;">FPS:</span> <span id="fpsDisplay">-</span></div></div>
    <div id="layerPanel"><div class="panel-title">Elementos Estructurales</div><div id="layerContent">Cargando modelo...</div></div>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        scene.collisionsEnabled = true;
        scene.gravity = null;
        
        const camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 0, 0), scene);
        camera.checkCollisions = true;
        camera.applyGravity = false;
        camera.ellipsoid = new BABYLON.Vector3(0.5, 1.7, 0.5);
        camera.speed = 0.15;
        camera.attachControl(canvas, true);
        
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 1;
        
        const teclas = { w: false, a: false, s: false, d: false, espacio: false };
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w') teclas.w = true; if (k === 'a') teclas.a = true; if (k === 's') teclas.s = true; if (k === 'd') teclas.d = true;
            if (k === ' ') { teclas.espacio = true; e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w') teclas.w = false; if (k === 'a') teclas.a = false; if (k === 's') teclas.s = false; if (k === 'd') teclas.d = false;
            if (k === ' ') teclas.espacio = false;
        });
        
        const layerManager = {
            floors: {},
            init: async (model) => {
                model.getChildMeshes(true).forEach(mesh => {
                    mesh.checkCollisions = true;
                    let floor = 'OTROS';
                    if (mesh.parent) {
                        const name = (mesh.parent.name || '').toUpperCase();
                        if (name.includes('PISO 1') || name.includes('1.')) floor = 'PISO 1';
                        else if (name.includes('PISO 2') || name.includes('2.')) floor = 'PISO 2';
                        else if (name.includes('PISO 3') || name.includes('3.')) floor = 'PISO 3';
                        else if (name.includes('PISO 4') || name.includes('4.')) floor = 'PISO 4';
                        else if (name.includes('PISO 5') || name.includes('5.')) floor = 'PISO 5';
                        else if (name.includes('CUBIERTA') || name.includes('6.')) floor = 'CUBIERTA';
                    }
                    if (!layerManager.floors[floor]) layerManager.floors[floor] = [];
                    layerManager.floors[floor].push({ mesh, name: mesh.name.substring(0, 25), visible: true });
                });
                layerManager.buildUI();
            },
            buildUI: () => {
                const content = document.getElementById('layerContent');
                content.innerHTML = '';
                ['PISO 1', 'PISO 2', 'PISO 3', 'PISO 4', 'PISO 5', 'CUBIERTA'].forEach((floor, idx) => {
                    if (!layerManager.floors[floor]) return;
                    const sec = document.createElement('div');
                    sec.className = 'floor-section';
                    const hdr = document.createElement('div');
                    hdr.className = 'floor-header';
                    hdr.innerHTML = `<div class="floor-toggle">${idx === 0 ? '▼' : '▶'}</div><div class="floor-name">${floor}</div>`;
                    const cont = document.createElement('div');
                    cont.className = `floor-items${idx > 0 ? ' collapsed' : ''}`;
                    layerManager.floors[floor].forEach(el => {
                        const itm = document.createElement('div');
                        itm.className = 'element-item';
                        const chk = document.createElement('div');
                        chk.className = 'element-checkbox checked';
                        const nm = document.createElement('div');
                        nm.className = 'element-name';
                        nm.textContent = el.name;
                        itm.appendChild(chk);
                        itm.appendChild(nm);
                        itm.addEventListener('click', () => {
                            el.visible = !el.visible;
                            el.mesh.setEnabled(el.visible);
                            chk.classList.toggle('checked');
                        });
                        cont.appendChild(itm);
                    });
                    hdr.addEventListener('click', () => {
                        cont.classList.toggle('collapsed');
                        hdr.querySelector('.floor-toggle').textContent = cont.classList.contains('collapsed') ? '▶' : '▼';
                    });
                    sec.appendChild(hdr);
                    sec.appendChild(cont);
                    content.appendChild(sec);
                });
            }
        };
        
        console.log('Iniciando carga del modelo...');
        BABYLON.SceneLoader.ImportMesh("", "https://raw.githubusercontent.com/XR1972/UNITROPICO-TECNICO/main/", "2. UNITROPICO ESTRUCTURA.glb", scene,
            async (meshes) => {
                console.log('✓ Modelo cargado:', meshes.length, 'meshes');
                const root = meshes[0];
                root.checkCollisions = true;
                const bb = root.getHierarchyBoundingVectors(true);
                const center = bb.max.add(bb.min).scale(0.5);
                const size = bb.max.subtract(bb.min);
                const dist = Math.max(size.x, size.y, size.z) * 1.5;
                camera.position = new BABYLON.Vector3(center.x + dist, center.y + dist * 0.3, center.z + dist);
                camera.setTarget(center);
                camera.maxZ = size.x + size.y + size.z;
                console.log('Cámara posicionada');
                await layerManager.init(root);
                console.log('✓ Panel creado');
            }, null, (err) => console.error('✗ Error:', err)
        );
        
        const getFloor = (y) => {
            const r = { 'PISO 1': [0, 3.2], 'PISO 2': [3.2, 6.4], 'PISO 3': [6.4, 9.6], 'PISO 4': [9.6, 12.8], 'PISO 5': [12.8, 16.0], 'CUBIERTA': [16.0, 20.0] };
            for (const [f, [min, max]] of Object.entries(r)) if (y >= min && y < max) return f;
            return 'DESCONOCIDO';
        };
        
        engine.runRenderLoop(() => {
            document.getElementById('pisoDisplay').textContent = getFloor(camera.position.y);
            document.getElementById('posDisplay').textContent = `${camera.position.x.toFixed(1)}, ${camera.position.y.toFixed(1)}, ${camera.position.z.toFixed(1)}`;
            document.getElementById('fpsDisplay').textContent = engine.getFps().toFixed(0);
            
            const dir = new BABYLON.Vector3(0, 0, 0);
            if (teclas.w) dir.z += 1; if (teclas.s) dir.z -= 1; if (teclas.a) dir.x -= 1; if (teclas.d) dir.x += 1;
            
            if (dir.length() > 0) {
                dir.normalize();
                const mov = BABYLON.Vector3.TransformCoordinates(dir, BABYLON.Matrix.RotationY(camera.rotation.y));
                camera.position.addInPlace(mov.scale(camera.speed));
            }
            
            scene.render();
        });
        
        window.addEventListener('resize', () => engine.resize());
    </script>
</body>
</html>
